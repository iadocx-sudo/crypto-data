name: update-data

on:
  schedule:
    - cron: "0 */6 * * *"   # 6時間ごと(UTC)
  workflow_dispatch: {}       # 手動実行ボタン

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch data
        env:
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
        run: python fetch_free.py
      - name: commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/latest.json
          git commit -m "update $(date -u +%FT%TZ)" || echo "no change"
          git push
